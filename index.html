<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pete Berry on GitHub</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/brunsnik-logo.svg">
    <link rel="preload" href="/assets/fonts/HankenGrotesk-VariableFont_wght.ttf" as="font" type="font/ttf">
    <style id="early-rendering-css">
        :root {
            /* Blues */
            --color-blue: #7e9ec5;
            --color-blue-darker: #5479a4;
            --color-blue-darkest: #375d8c;
            --color-blue-lighter: #adc5e1;
            --color-blue-lightest: #dde8f5;

            /* Browns */
            --color-beige: #8f783e;
            --color-caramel: #7e5c21;
            --color-tan: #503d0c;
            --color-brown: #302300;
            --color-mahogany: #161000;

            /* Whites and Grays */
            --color-white: #ffffff;
            --color-off-white: #faf9f9;
            --color-white-smoke: #f5f5f5;
            --color-silver: #cccaca;
            --color-steel: #a49d9d;
            --color-gunmetal-gray: #353e43;
        }

        :root {
            --color-body-bg: var(--color-off-white);
            --color-main-bg: var(--color-off-white);
            --color-text: var(--color-gunmetal-gray);
            --color-link-text: var(--color-tan);
            --color-link-hover-text: var(--color-caramel);
            --color-nav-text: var(--color-link-text);
            --color-nav-hover-text: var(--color-nav-text);
            --color-nav-hover-bg: rgb(from var(--color-caramel) r g b / 10%);
            --max-content-width: 1280px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        strong {
            font-weight: bolder;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        figure,
        p,
        ol,
        ul {
            margin: 0;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            font-size: inherit;
            font-weight: inherit;
        }

        img {
            display: block;
            max-inline-size: 100%;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("/assets/fonts/HankenGrotesk-VariableFont_wght.ttf") format("truetype");
        }

        body {
            background-color: var(--color-body-bg);
            font-family: Garamond, Georgia, "Times New Roman", serif;
            line-height: 1.35;
            font-size: 1rem;
            color: var(--color-text);
        }

        main,
        article {
            background-color: var(--color-main-bg);
            width: 100%;
            max-width: var(--max-content-width);
            padding: 0 1rem;
            margin-block: 0;
            margin-inline: auto;
        }

        @media screen and (max-width: 1280px) {
            main,
            article {
                --max-content-width: calc(100vw - 4rem);
            }
        }

        @media screen and (max-width: 768px) {
            main,
            article {
                --max-content-width: calc(100vw - 1.5rem);
            }
        }

        main {
            padding-block: 2rem;
        }
    </style>
    <link rel="stylesheet" href="/assets/styles/site.css" type="text/css">
</head>
<body>
<main>
    <h1>Pete Berry on GitHub</h1>
    <p>This site is not my official <a href="https://brunsnik.net">website</a>, just a place to try out a few ideas
        related to HTML, CSS, and JavaScript.</p>
    <p>Check out my <a href="https://github.com/pwcberry">GitHub profile</a>.</p>
</main>
</body>
</html>
