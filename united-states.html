<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>The United States | Pointless tips</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/brunsnik-logo.svg">
    <link rel="preload" href="/assets/fonts/HankenGrotesk-VariableFont_wght.ttf" as="font" type="font/ttf">
    <style id="early-rendering-css">
        :root {
            /* Blues */
            --color-blue: #7e9ec5;
            --color-blue-darker: #5479a4;
            --color-blue-darkest: #375d8c;
            --color-blue-lighter: #adc5e1;
            --color-blue-lightest: #dde8f5;

            /* Browns */
            --color-beige: #8f783e;
            --color-caramel: #7e5c21;
            --color-tan: #503d0c;
            --color-brown: #302300;
            --color-mahogany: #161000;

            /* Whites and Grays */
            --color-white: #ffffff;
            --color-off-white: #faf9f9;
            --color-white-smoke: #f5f5f5;
            --color-silver: #cccaca;
            --color-steel: #a49d9d;
            --color-gunmetal-gray: #353e43;
        }

        :root {
            --color-body-bg: var(--color-off-white);
            --color-main-bg: var(--color-off-white);
            --color-text: var(--color-gunmetal-gray);
            --color-link-text: var(--color-tan);
            --color-link-hover-text: var(--color-caramel);
            --color-nav-text: var(--color-link-text);
            --color-nav-hover-text: var(--color-nav-text);
            --color-nav-hover-bg: rgb(from var(--color-caramel) r g b / 10%);
            --max-content-width: 1280px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        strong {
            font-weight: bolder;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        figure,
        p,
        ol,
        ul {
            margin: 0;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            font-size: inherit;
            font-weight: inherit;
        }

        img {
            display: block;
            max-inline-size: 100%;
        }

        @font-face {
            font-family: "Hanken Grotesk";
            src: url("/assets/fonts/HankenGrotesk-VariableFont_wght.ttf") format("truetype");
        }

        body {
            background-color: var(--color-body-bg);
            font-family: Garamond, Georgia, "Times New Roman", serif;
            line-height: 1.35;
            font-size: 1rem;
            color: var(--color-text);
        }

        main {
            background-color: var(--color-main-bg);
            width: 100%;
            max-width: var(--max-content-width);
            padding: 2rem 1rem;
            margin-block: 0;
            margin-inline: auto;
        }

        @media screen and (max-width: 1280px) {
            main {
                --max-content-width: calc(100vw - 4rem);
            }
        }

        @media screen and (max-width: 768px) {
            main {
                --max-content-width: 100vw;
                margin-inline: 0;
            }

            table {
                table-layout: fixed;

                th {
                    hyphens: manual;
                }

                td {
                    overflow-wrap: break-word;
                    hyphens: auto;
                }
            }
        }

        table {
            border-collapse: collapse;
            width: 100%;

            thead {
                position: sticky;
                top: 0;
            }

            th {
                font-weight: bold;
                background-color: var(--color-blue);
                color: var(--color-white);
                text-align: left;
                vertical-align: bottom;
            }

            th, td {
                padding: 0.5rem 1rem 0.5rem 0.5rem;
            }

            td {
                border-bottom: 1px solid var(--color-blue);
            }

            tr:nth-child(2n) td:not(.series) {
                background-color: var(--color-blue-lightest);
            }
        }

        select {
            font-size: 1rem;
            padding: 0.5rem 0.25rem;
        }
    </style>
    <link rel="stylesheet" href="/assets/styles/site.css" type="text/css">
</head>
<body>
<main>
    <h1>The United States of America</h1>
    <p><label for="sort_property">Sort by:</label>
        <select id="sort_property">
            <option value="name" selected>State name</option>
            <option value="capital">State capital</option>
            <option value="areaSqKm">Area</option>
            <option value="population">Population</option>
        </select></p>
    <p><label>Order by:</label><br/>
        <label><input type="radio" name="order_by" value="ascending" checked> A to Z / lowest to highest</label>
        <label><input type="radio" name="order_by" value="descending"> Z to A / highest to lowest</label>
    </p>
    <table>
        <thead>
        <tr>
            <th>State</th>
            <th>Capital</th>
            <th>Area (km<sup>2</sup>)</th>
            <th>Popul&shy;ation</th>
            <th>Year of state&shy;hood</th>
        </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</main>
</body>
<script type="module">
    import STATES from "./assets/data/us-states.json" with { type: "json" };
    const numberFormatter = new Intl.NumberFormat("en-AU", {style: "decimal"});

    const sortNumericData = (key, order) => order === "descending" ? STATES.toSorted((a, b) => b[key] - a[key]) : STATES.toSorted((a, b) => a[key] - b[key]);
    const sortTextData = (key, order) => order === "descending" ? STATES.toSorted((a,b) => b[key] > a[key] ? 1 : -1) : STATES.toSorted((a, b) => a[key] > b[key] ? 1 : -1);

    const addCell = (tr, value) => {
        const td = document.createElement("td");
        td.textContent = typeof value === "number" ? numberFormatter.format(value) : value;
        tr.appendChild(td);
    };

    const updateTable = (table, data) => {
        let tbody = table.tBodies[0];

        if (tbody.rows.length > 0) {
            tbody = document.createElement("tbody");
            table.appendChild(tbody);
            table.removeChild(table.tBodies[0]);
        }

        for (const item of data) {
            const tr = document.createElement("tr");
            addCell(tr, item.name);
            addCell(tr, item.capital);
            addCell(tr, item.areaSqKm);
            addCell(tr, item.population);
            addCell(tr, item.founded.substring(0, 4));
            tbody.appendChild(tr);
        }
    };

    const table = document.querySelector("table");
    updateTable(table, STATES);

    document.querySelector("main").addEventListener("change", () => {
        const numericKeys = ["areaSqKm", "population"]
        const dropdown = document.querySelector("select");
        const columnKey = dropdown.options[dropdown.selectedIndex].value;
        const order = document.querySelector("input[name=order_by]:checked").value;
        const data = numericKeys.includes(columnKey) ? sortNumericData(columnKey, order) : sortTextData(columnKey, order);
        updateTable(table, data);
    });
</script>
</html>
